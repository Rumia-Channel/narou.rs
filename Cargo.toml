[workspace]
members = ["worker_entry"]
resolver = "3"

[package]
name = "narou_rs"
version = "0.4.0"
edition = "2024"
license = "BSD-2-Clause"
readme = "README.md"

[features]
default = ["native-runtime"]
native-runtime = [
    "dep:reqwest",
    "dep:axum",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:askama",
    "dep:clap",
    "dep:open",
    "dep:tracing-subscriber",
    "dep:dashmap",
    "dep:tower-http",
    "dep:ua_generator",
    "dep:curl",
    "dep:indicatif",
    "dep:zip",
    "dep:lettre",
    "dep:unicode-normalization",
    "dep:similar",
    "dep:tempfile",
    "dep:shell-words",
    "dep:csv",
    "dep:ctrlc",
    "dep:socket2",
    "dep:getrandom",
    "dep:fs2",
    "dep:libc",
    "dep:rusqlite",
]
# `lite`: embed AozoraEpub3_Lite (GPL-3.0-only) as the in-process EPUB
# engine. Binaries built with this feature are distributed under GPL-3.0;
# see assets/aozora_lite/LICENSE.md. The Worker runtime enables it always.
lite = ["dep:aozora_epub3_lite"]
worker-runtime = ["lite"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
reqwest = { version = "0.12", features = ["cookies", "gzip", "brotli", "deflate", "blocking", "native-tls", "native-tls-vendored"], optional = true }
axum = { version = "0.8", features = ["macros", "ws"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-stream = { version = "0.1", optional = true }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
askama = { version = "0.12", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
open = { version = "5", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true }
parking_lot = "0.12"
dashmap = { version = "6", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
futures = "0.3"
pest = "2.8"
pest_derive = "2.8"
ua_generator = { git = "https://github.com/spider-rs/ua_generator.git", version = "0.5", optional = true }
curl = { version = "0.4", features = ["static-ssl"], optional = true }
indicatif = { version = "0.18", optional = true }
encoding_rs = "0.8"
zip = { version = "8.5", optional = true }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls"], optional = true }
unicode-normalization = { version = "0.1", optional = true }
similar = { version = "3.1", optional = true }
tempfile = { version = "3.27", optional = true }
shell-words = { version = "1.1", optional = true }
csv = { version = "1.4", optional = true }
ctrlc = { version = "3.5", optional = true }
fancy-regex = "0.17"
socket2 = { version = "0.6", optional = true }
chrono-tz = { version = "0.10", features = ["case-insensitive"] }
subtle = "2.6"
getrandom = { version = "0.4", optional = true }
fs2 = { version = "0.4", optional = true }
libc = { version = "0.2", optional = true }
url = "2"
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
aozora_epub3_lite = { git = "https://github.com/Rumia-Channel/AozoraEpub3_Lite", rev = "69f6904", optional = true }
base64 = "0.22"

[build-dependencies]
base64 = "0.22"
sha3 = "0.11"

[[bin]]
name = "narou_rs"
path = "src/main.rs"
required-features = ["native-runtime"]

[[bin]]
name = "narou_rs_updater"
path = "src/bin/updater.rs"
required-features = ["native-runtime"]

[[bin]]
name = "cargo-local-build"
path = "src/bin/cargo-local-build.rs"
required-features = ["native-runtime"]

[target."cfg(windows)".dependencies]
tray-icon = "0.22"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
mailparse = "0.16"
