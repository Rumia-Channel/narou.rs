<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>メモ帳 - Narou.rb WEB UI</title>
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <style>
    .notepad-container {
      max-width: 56em;
      margin: 1.5em auto;
      padding: 0 var(--container-padding);
    }
    .notepad-container h1 {
      font-size: 1.6em;
      margin-bottom: 0.5em;
    }
    .notepad-container ul {
      color: var(--text-muted);
      margin-bottom: 1em;
      padding-left: 1.5em;
    }
    #notepad {
      width: 100%;
      min-height: 24em;
      padding: 0.6em;
      font-size: var(--base-font-size);
      color: var(--text-color);
      background-color: var(--input-bg);
      border: 0.07em solid var(--input-border);
      border-radius: var(--border-radius);
      resize: vertical;
    }
    #notepad:focus {
      border-color: var(--btn-primary-bg);
      outline: none;
    }
    .notepad-status {
      margin-top: 0.4em;
      font-size: 0.85em;
      color: var(--text-muted);
    }
    .notepad-status.error {
      color: var(--danger-color);
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a class="navbar-brand" href="/">Narou.rb</a>
    </div>
  </nav>
  <div class="notepad-container">
    <h1>メモ帳</h1>
    <ul>
      <li>編集したら自動でサーバに保存されます</li>
      <li>別のブラウザで開いていても内容をリアルタイムに同期します</li>
    </ul>
    <textarea id="notepad"></textarea>
    <div class="notepad-status" id="notepad-status"></div>
  </div>
  <script type="module">
    import { fetchJson } from '/assets/js/core/http.js';
    import { createNotepadEditor } from '/assets/js/core/notepad.js';
    (function() {
      var textarea = document.getElementById('notepad');
      var status = document.getElementById('notepad-status');
      var saveTimer = null;
      var statusTimer = null;
      var editor = createNotepadEditor(textarea);

      function showStatus(message, isError) {
        status.classList.toggle('error', Boolean(isError));
        status.textContent = message;
        if (statusTimer) clearTimeout(statusTimer);
        statusTimer = setTimeout(function() {
          if (status.textContent === message) {
            status.textContent = '';
            status.classList.remove('error');
          }
        }, 2000);
      }

      editor.load().catch(function(error) {
        showStatus('読み込みに失敗しました: ' + error.message, true);
      });

      function connectWebSocket(wsPort) {
        var url = new URL('/ws', location.href);
        url.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        var ws = new WebSocket(url.toString());
        ws.onmessage = function(event) {
          try {
            var msg = JSON.parse(event.data);
            if (msg.type === 'notepad.change') {
              var result = editor.applySnapshot(msg.data);
              if (result.applied) {
                showStatus('他の画面の変更を反映しました');
              } else if (result.keptLocalEdits) {
                showStatus('サーバのメモ帳が更新されました。入力内容は保持しています', true);
              }
            }
          } catch (_) {}
        };
        ws.onclose = function() { setTimeout(function() { connectWebSocket(wsPort); }, 5000); };
      }

      fetchJson('/api/webui/config')
        .then(function(data) {
          if (data && data.ws_port) connectWebSocket(data.ws_port);
        }).catch(function(error) {
          showStatus('接続設定の読み込みに失敗しました: ' + error.message, true);
        });

      textarea.addEventListener('input', function() {
        if (saveTimer) clearTimeout(saveTimer);
        status.textContent = '';
        status.classList.remove('error');
        saveTimer = setTimeout(function() {
          editor.save().then(function(result) {
            if (result.saved) showStatus(result.dirty
              ? '前の入力を保存しました。新しい入力は未保存です'
              : result.data.message || '保存しました');
          }).catch(function(error) {
            showStatus('保存に失敗しました: ' + error.message, true);
          });
        }, 500);
      });
    })();
  </script>
</body>
</html>
