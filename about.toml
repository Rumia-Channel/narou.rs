# cargo-about configuration for the GPL-side artifacts (the `lite` binaries and
# the Cloudflare Worker, which always enables `lite`).
#
# The workspace scan sees this graph: `worker_entry` depends on
# `worker-runtime`, which implies `lite`, so workspace-wide feature unification
# enables `narou_rs/lite` for every `cargo about` run rooted at the workspace.
# `lite` embeds AozoraEpub3_Lite, which is GPL-3.0-only.
#
# GPL is therefore accepted per crate only, never globally: the two known
# GPL-3.0-only components may appear, and any new copyleft dependency still
# fails the scan.
#
# The non-GPL binaries are covered by `about-non-gpl.toml`, which runs against
# `about-probe/Cargo.toml` (the same `narou_rs` without `lite`) and accepts no
# GPL at all.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "armv7-unknown-linux-gnueabihf",
    "arm-unknown-linux-gnueabihf",
]

workarounds = [
    "bitvec",
    "chrono",
    "cocoa",
    "gtk",
    "ring",
    "rustix",
    "rustls",
    "wasmtime",
]

# Embedded EPUB engine (assets/aozora_lite/LICENSE.md).
[aozora_epub3_lite]
accepted = ["GPL-3.0-only"]

# Worker runtime: `worker-runtime` implies `lite`, so the deployed Worker is
# distributed under GPL-3.0-only as well.
[narou_worker]
accepted = ["GPL-3.0-only"]
