name: Platform portability

on:
  push:
    # develop 更新で develop 環境へ、v* タグで production 環境へデプロイする
    # (下の worker-deploy-* を参照)。
    branches: [develop, refactor-platform-abstraction, main]
    # release.yml と同じタグ集合 (v* と数字始まり) で production へ。
    tags: ["v*", "[0-9]*"]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        options: [develop, production]
        default: develop

permissions:
  contents: read

jobs:
  native:
    name: Native check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - name: Regression - SQLite converter settings (issue 22)
        run: cargo test -p narou_rs --lib converter_reads_sqlite_backed_default_and_force_settings
      - name: Regression - latest list ordering (issue 21)
        run: cargo test -p narou_rs --bin narou_rs list_latest_sorts_newest_first
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features
      # Verify the non-GPL binaries actually link (check/test do not).
      - run: cargo build -p narou_rs --bins

  native-gpl:
    name: Native check (lite/GPL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: gpl
      - run: cargo check -p narou_rs --all-targets --features lite
      - run: cargo test -p narou_rs --lib --features lite
      # Verify the GPL (embedded AozoraEpub3_Lite) binary links.
      - run: cargo build -p narou_rs --bin narou_rs --features lite

  wasm:
    name: Portable wasm check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p narou_rs --target wasm32-unknown-unknown --no-default-features --features worker-runtime
      - run: cargo check -p narou_worker --target wasm32-unknown-unknown

  worker:
    name: Worker release artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker_entry
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install worker-build --version 0.8.5 --locked
      - run: worker-build --release

  worker-contract:
    name: Worker contract tests (local workerd)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker_entry
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cargo install worker-build --version 0.8.5 --locked
      # tests/run.mjs builds, applies the local D1 migrations, starts
      # `wrangler dev` and runs the contract checks (health, fail-closed auth,
      # library/jobs APIs, and a queue-backed Convert job reaching a terminal
      # state).
      - run: node tests/run.mjs --release
        env:
          NAROU_ADMIN_TOKEN: contract-token
          # トークンを外した構成で fail-closed も確かめる。
          NAROU_CHECK_UNCONFIGURED: "1"

  # デプロイはリポジトリの secret を設定したうえで手動実行する。
  # 必要な値 (GitHub の environment = target 名で設定):
  #   secrets.CLOUDFLARE_API_TOKEN / secrets.CLOUDFLARE_ACCOUNT_ID
  #   vars/secrets: NAROU_D1_DATABASE_NAME / NAROU_D1_DATABASE_ID /
  #                 NAROU_JOB_QUEUE / NAROU_JOB_DLQ /
  #                 NAROU_S3_ENDPOINT / NAROU_S3_REGION / NAROU_S3_BUCKET
  #                 (+ production のみ SERVICE_DOMAIN)
  #   secrets.NAROU_ADMIN_TOKEN (デプロイ後の smoke test で使う。Zero Trust を
  #                 境界にする場合は NAROU_AUTH_REQUIRED=false で不要になる)
  # 未設定の間は workflow_dispatch から実行しても失敗するだけで、push では走らない。
  # デプロイ。GitHub Environments は用途で 2 つに分ける:
  #   `Cloudflare` … この 2 ジョブ (develop / production) が使う Workers 用の値
  #     secrets: CLOUDFLARE_ACCOUNT_ID (または CLOUDFLARE_ACCOUT_ID) / CLOUDFLARE_API_TOKEN /
  #              SERVICE_DOMAIN (production 必須) / DEVELOP_DOMAIN (develop・任意。ドメインは
  #              公開ログに残さないため secrets 推奨) /
  #              NAROU_ADMIN_TOKEN (Zero Trust が境界なら不要) / NAROU_RS_LOGIN_KEY (任意) /
  #              NAROU_S3_ACCESS_KEY_ID・NAROU_S3_SECRET_ACCESS_KEY (任意。S3 資格情報) /
  #              CF_ACCESS_CLIENT_ID・CF_ACCESS_CLIENT_SECRET (smoke 用・任意)
  #     vars:    NAROU_AUTH_REQUIRED (任意) / NAROU_WORKERS_DEV (任意) /
  #              NAROU_S3_ENDPOINT / NAROU_S3_REGION / NAROU_S3_BUCKET /
  #              NAROU_S3_PREFIX (任意。未設定なら narou/<target>) /
  #              NAROU_SECRETS_STORE_ID と *_SECRET_NAME (Secrets Store を使う場合)
  #   `CodeSining` … release.yml の Windows 署名 (CERTUM_USERNAME / CERTUM_OTP_URI /
  #                  CERTUM_KEY_ID)
  # 対象は `NAROU_DEPLOY_TARGET` (develop / production) で切り替えるので、
  # target ごとに環境を分けずに同じ環境を共有している (SERVICE_DOMAIN と
  # DEVELOP_DOMAIN は名前が違うため衝突しない)。
  # D1・Queue は `ci/provision_resources.py` が target 名から導出して冪等に作る。
  worker-deploy-develop:
    name: Deploy Worker (develop)
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop')
      || (github.event_name == 'workflow_dispatch' && inputs.target == 'develop')
    needs: [native, native-gpl, wasm, worker, worker-contract, license]
    runs-on: ubuntu-latest
    concurrency:
      group: narou-worker-develop
      cancel-in-progress: false
    environment:
      # Workers 用の資格情報は用途別の 1 環境にまとめる (署名は CodeSining)。
      name: Cloudflare
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker_entry
    env:
      # Dantalian と同じ綴り (`ACCOUT_ID`) でも動くようにしておく。
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NAROU_DEPLOY_TARGET: develop
      # ドメインは公開ログに出さないため secrets を推奨 (vars も後方互換で動く)。
      DEVELOP_DOMAIN: ${{ secrets.DEVELOP_DOMAIN || vars.DEVELOP_DOMAIN }}
      NAROU_ADMIN_TOKEN: ${{ secrets.NAROU_ADMIN_TOKEN }}
      NAROU_RS_LOGIN_KEY: ${{ secrets.NAROU_RS_LOGIN_KEY }}
      NAROU_S3_ACCESS_KEY_ID: ${{ secrets.NAROU_S3_ACCESS_KEY_ID }}
      NAROU_S3_SECRET_ACCESS_KEY: ${{ secrets.NAROU_S3_SECRET_ACCESS_KEY }}
      NAROU_S3_ENDPOINT: ${{ vars.NAROU_S3_ENDPOINT }}
      NAROU_S3_REGION: ${{ vars.NAROU_S3_REGION }}
      NAROU_S3_BUCKET: ${{ vars.NAROU_S3_BUCKET }}
      NAROU_S3_PREFIX: ${{ vars.NAROU_S3_PREFIX }}
      # Secrets Store を使う場合だけ設定する (名前だけを渡し、値はストアに置く)。
      NAROU_SECRETS_STORE_ID: ${{ secrets.NAROU_SECRETS_STORE_ID || vars.NAROU_SECRETS_STORE_ID }}
      NAROU_S3_ACCESS_KEY_ID_SECRET_NAME: ${{ secrets.NAROU_S3_ACCESS_KEY_ID_SECRET_NAME || vars.NAROU_S3_ACCESS_KEY_ID_SECRET_NAME }}
      NAROU_S3_SECRET_ACCESS_KEY_SECRET_NAME: ${{ secrets.NAROU_S3_SECRET_ACCESS_KEY_SECRET_NAME || vars.NAROU_S3_SECRET_ACCESS_KEY_SECRET_NAME }}
      NAROU_S3_ENDPOINT_SECRET_NAME: ${{ secrets.NAROU_S3_ENDPOINT_SECRET_NAME || vars.NAROU_S3_ENDPOINT_SECRET_NAME }}
      NAROU_S3_REGION_SECRET_NAME: ${{ secrets.NAROU_S3_REGION_SECRET_NAME || vars.NAROU_S3_REGION_SECRET_NAME }}
      NAROU_S3_BUCKET_SECRET_NAME: ${{ secrets.NAROU_S3_BUCKET_SECRET_NAME || vars.NAROU_S3_BUCKET_SECRET_NAME }}
      # トークンと復号鍵も Secrets Store に置く場合だけ設定する。
      NAROU_ADMIN_TOKEN_SECRET_NAME: ${{ vars.NAROU_ADMIN_TOKEN_SECRET_NAME }}
      NAROU_RS_LOGIN_KEY_SECRET_NAME: ${{ vars.NAROU_RS_LOGIN_KEY_SECRET_NAME }}
      # Zero Trust (Cloudflare Access) を境界にする場合は false にする。
      NAROU_AUTH_REQUIRED: ${{ vars.NAROU_AUTH_REQUIRED || 'true' }}
      # Access の service token (custom domain 越しに smoke を流す場合だけ)。
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CI と同じ worker-build を固定する (ローカル・他のジョブと揃える)。
      - run: cargo install worker-build --version 0.8.5 --locked
      # 資格情報が無い環境 (fork / 未設定) では理由を出して省略する。
      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare の secret が未設定のため develop へのデプロイを省略します"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - run: python3 ci/deploy_worker.py
        if: steps.credentials.outputs.configured == 'true'


  worker-deploy-production:
    name: Deploy Worker (production)
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag')
      || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    needs: [native, native-gpl, wasm, worker, worker-contract, license]
    runs-on: ubuntu-latest
    concurrency:
      group: narou-worker-production
      cancel-in-progress: false
    environment:
      # Workers 用の資格情報は用途別の 1 環境にまとめる (署名は CodeSining)。
      name: Cloudflare
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker_entry
    env:
      # Dantalian と同じ綴り (`ACCOUT_ID`) でも動くようにしておく。
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NAROU_DEPLOY_TARGET: production
      # ドメインは公開ログに出さないため secrets を推奨 (vars も後方互換で動く)。
      SERVICE_DOMAIN: ${{ secrets.SERVICE_DOMAIN || vars.SERVICE_DOMAIN }}
      NAROU_ADMIN_TOKEN: ${{ secrets.NAROU_ADMIN_TOKEN }}
      NAROU_RS_LOGIN_KEY: ${{ secrets.NAROU_RS_LOGIN_KEY }}
      NAROU_S3_ACCESS_KEY_ID: ${{ secrets.NAROU_S3_ACCESS_KEY_ID }}
      NAROU_S3_SECRET_ACCESS_KEY: ${{ secrets.NAROU_S3_SECRET_ACCESS_KEY }}
      NAROU_S3_ENDPOINT: ${{ vars.NAROU_S3_ENDPOINT }}
      NAROU_S3_REGION: ${{ vars.NAROU_S3_REGION }}
      NAROU_S3_BUCKET: ${{ vars.NAROU_S3_BUCKET }}
      NAROU_S3_PREFIX: ${{ vars.NAROU_S3_PREFIX }}
      # Secrets Store を使う場合だけ設定する (名前だけを渡し、値はストアに置く)。
      NAROU_SECRETS_STORE_ID: ${{ secrets.NAROU_SECRETS_STORE_ID || vars.NAROU_SECRETS_STORE_ID }}
      NAROU_S3_ACCESS_KEY_ID_SECRET_NAME: ${{ secrets.NAROU_S3_ACCESS_KEY_ID_SECRET_NAME || vars.NAROU_S3_ACCESS_KEY_ID_SECRET_NAME }}
      NAROU_S3_SECRET_ACCESS_KEY_SECRET_NAME: ${{ secrets.NAROU_S3_SECRET_ACCESS_KEY_SECRET_NAME || vars.NAROU_S3_SECRET_ACCESS_KEY_SECRET_NAME }}
      NAROU_S3_ENDPOINT_SECRET_NAME: ${{ secrets.NAROU_S3_ENDPOINT_SECRET_NAME || vars.NAROU_S3_ENDPOINT_SECRET_NAME }}
      NAROU_S3_REGION_SECRET_NAME: ${{ secrets.NAROU_S3_REGION_SECRET_NAME || vars.NAROU_S3_REGION_SECRET_NAME }}
      NAROU_S3_BUCKET_SECRET_NAME: ${{ secrets.NAROU_S3_BUCKET_SECRET_NAME || vars.NAROU_S3_BUCKET_SECRET_NAME }}
      # トークンと復号鍵も Secrets Store に置く場合だけ設定する。
      NAROU_ADMIN_TOKEN_SECRET_NAME: ${{ vars.NAROU_ADMIN_TOKEN_SECRET_NAME }}
      NAROU_RS_LOGIN_KEY_SECRET_NAME: ${{ vars.NAROU_RS_LOGIN_KEY_SECRET_NAME }}
      # Zero Trust (Cloudflare Access) を境界にする場合は false にする。
      NAROU_AUTH_REQUIRED: ${{ vars.NAROU_AUTH_REQUIRED || 'true' }}
      # Access の service token (custom domain 越しに smoke を流す場合だけ)。
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CI と同じ worker-build を固定する (ローカル・他のジョブと揃える)。
      - run: cargo install worker-build --version 0.8.5 --locked
      # 資格情報が無い環境 (fork / 未設定) では理由を出して省略する。
      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare の secret が未設定のため production へのデプロイを省略します"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - run: python3 ci/deploy_worker.py
        if: steps.credentials.outputs.configured == 'true'


  license:
    name: Third-party license notices
    runs-on: ubuntu-latest
    env:
      # Pinned: the committed notices were generated with this version and the
      # job fails on any output difference, so the generator must match.
      CARGO_ABOUT_VERSION: "0.9.2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-about
      - run: cargo install cargo-about --locked --features cli --version "$CARGO_ABOUT_VERSION"
        env:
          # Keep the install inside ./target so rust-cache can reuse it.
          CARGO_TARGET_DIR: target/cargo-about
      # cargo-about reads license files from extracted crate sources; without
      # this only the .crate archives are present and the notices would differ.
      - run: cargo fetch --locked
      # The second command is also the copyleft gate: it fails when a GPL
      # dependency reaches the non-GPL dependency graph (about-probe).
      - name: Regenerate notices
        run: |
          cargo-about generate --workspace --locked --offline -c about.toml -o Third-Party-License.md about.hbs
          cargo-about generate -m about-probe/Cargo.toml -c about-non-gpl.toml --locked --offline -o Third-Party-License-non-GPL.md about.hbs
      - name: Committed notices are current
        run: git diff --exit-code -- Third-Party-License.md Third-Party-License-non-GPL.md
      # Section 3 is written by hand; regenerating the notices would not notice
      # a stale table, so compare it against the manifest.
      - name: Direct dependency table is current
        run: python3 scripts/check-license-table.py
