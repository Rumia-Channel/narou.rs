name: Platform portability

on:
  push:
    branches: [develop, refactor-platform-abstraction]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features
      # Verify the non-GPL binaries actually link (check/test do not).
      - run: cargo build -p narou_rs --bins

  native-gpl:
    name: Native check (lite/GPL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: gpl
      - run: cargo check -p narou_rs --all-targets --features lite
      - run: cargo test -p narou_rs --lib --features lite
      # Verify the GPL (embedded AozoraEpub3_Lite) binary links.
      - run: cargo build -p narou_rs --bin narou_rs --features lite

  wasm:
    name: Portable wasm check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p narou_rs --target wasm32-unknown-unknown --no-default-features --features worker-runtime
      - run: cargo check -p narou_worker --target wasm32-unknown-unknown

  worker:
    name: Worker release artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker_entry
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install worker-build --version 0.8.5 --locked
      - run: worker-build --release
