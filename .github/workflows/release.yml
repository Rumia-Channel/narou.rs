name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches Cargo.toml version
        id: version
        shell: pwsh
        run: |
          $cargoToml = Get-Content Cargo.toml -Raw
          if ($cargoToml -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "Could not find package version in Cargo.toml."
          }

          $version = $Matches[1]
          $tag = "${{ github.ref_name }}"
          # Tag match is enforced only when the ref is an actual tag
          # (push to a tag, or a manual dispatch that selected a tag).
          if ("${{ github.ref_type }}" -eq "tag") {
            $escapedVersion = [regex]::Escape($version)
            if ($tag -notmatch "^(?:v)?$escapedVersion(?:[-+][0-9A-Za-z.-]+)?$") {
              throw "Tag '$tag' does not match Cargo.toml version '$version' or an allowed prerelease/build variant of it."
            }
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $isPrerelease = ("${{ github.ref_type }}" -eq "tag") -and ($tag -match "^[^+]*-")
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  build-helpers:
    name: Build helper binaries (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - name: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-updater-${{ matrix.os }}-${{ matrix.target }}

      - name: Add Rust target
        shell: pwsh
        run: rustup target add ${{ matrix.target }}

      - name: Build updater binary
        shell: pwsh
        env:
          NAROU_RS_RELEASE_BUILD: "1"
        run: cargo build --locked --release --target "${{ matrix.target }}" --bin narou_rs_updater

      - name: Upload unsigned updater
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-updater-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/narou_rs_updater.exe
          if-no-files-found: error

      - name: Build backup binary
        shell: pwsh
        env:
          NAROU_RS_RELEASE_BUILD: "1"
        run: cargo build --locked --release --target "${{ matrix.target }}" --bin narou_rs_backup

      - name: Upload unsigned backup binary
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-backup-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/narou_rs_backup.exe
          if-no-files-found: error

  sign-helpers:
    name: Sign Windows helper binaries
    needs: build-helpers
    runs-on: windows-2025
    environment: CodeSining
    steps:
      - name: Download unsigned helper binaries
        uses: actions/download-artifact@v4
        with:
          pattern: unsigned-*-*
          path: unsigned

      - name: Sign Windows helper binaries (Certum SimplySign)
        uses: Rumia-Channel/windows-certum-signin@main
        with:
          certum-username: ${{ secrets.CERTUM_USERNAME }}
          certum-otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certum-key-id: ${{ vars.CERTUM_KEY_ID }}
          signer: authenticode
          files: |
            unsigned\unsigned-updater-x86_64-pc-windows-msvc\narou_rs_updater.exe
            unsigned\unsigned-updater-aarch64-pc-windows-msvc\narou_rs_updater.exe
            unsigned\unsigned-backup-x86_64-pc-windows-msvc\narou_rs_backup.exe
            unsigned\unsigned-backup-aarch64-pc-windows-msvc\narou_rs_backup.exe

      - name: Upload signed updater (x64)
        uses: actions/upload-artifact@v4
        with:
          name: signed-updater-x86_64-pc-windows-msvc
          path: unsigned/unsigned-updater-x86_64-pc-windows-msvc/narou_rs_updater.exe
          if-no-files-found: error

      - name: Upload signed updater (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: signed-updater-aarch64-pc-windows-msvc
          path: unsigned/unsigned-updater-aarch64-pc-windows-msvc/narou_rs_updater.exe
          if-no-files-found: error

      - name: Upload signed backup binary (x64)
        uses: actions/upload-artifact@v4
        with:
          name: signed-backup-x86_64-pc-windows-msvc
          path: unsigned/unsigned-backup-x86_64-pc-windows-msvc/narou_rs_backup.exe
          if-no-files-found: error

      - name: Upload signed backup binary (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: signed-backup-aarch64-pc-windows-msvc
          path: unsigned/unsigned-backup-aarch64-pc-windows-msvc/narou_rs_backup.exe
          if-no-files-found: error

  build:
    needs:
      - validate
      - sign-helpers
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            platform: win
            arch: x64
            binary: narou_rs.exe
            target: x86_64-pc-windows-msvc
            builder: cargo
            features: ""
            variant: ""
          - name: Windows x64 (GPL)
            os: windows-2025
            platform: win
            arch: x64
            binary: narou_rs.exe
            target: x86_64-pc-windows-msvc
            builder: cargo
            features: lite
            variant: GPL
          - name: Windows ARM64
            os: windows-11-arm
            platform: win
            arch: arm64
            binary: narou_rs.exe
            target: aarch64-pc-windows-msvc
            builder: cargo
            features: ""
            variant: ""
          - name: Windows ARM64 (GPL)
            os: windows-11-arm
            platform: win
            arch: arm64
            binary: narou_rs.exe
            target: aarch64-pc-windows-msvc
            builder: cargo
            features: lite
            variant: GPL
          - name: macOS x64
            os: macos-15-intel
            platform: mac
            arch: x64
            binary: narou_rs
            target: x86_64-apple-darwin
            builder: cargo
            features: ""
            variant: ""
          - name: macOS x64 (GPL)
            os: macos-15-intel
            platform: mac
            arch: x64
            binary: narou_rs
            target: x86_64-apple-darwin
            builder: cargo
            features: lite
            variant: GPL
          - name: macOS ARM64
            os: macos-15
            platform: mac
            arch: arm64
            binary: narou_rs
            target: aarch64-apple-darwin
            builder: cargo
            features: ""
            variant: ""
          - name: macOS ARM64 (GPL)
            os: macos-15
            platform: mac
            arch: arm64
            binary: narou_rs
            target: aarch64-apple-darwin
            builder: cargo
            features: lite
            variant: GPL
          - name: Linux x64
            os: ubuntu-24.04
            platform: linux
            arch: x64
            binary: narou_rs
            target: x86_64-unknown-linux-gnu
            builder: cargo
            features: ""
            variant: ""
          - name: Linux x64 (GPL)
            os: ubuntu-24.04
            platform: linux
            arch: x64
            binary: narou_rs
            target: x86_64-unknown-linux-gnu
            builder: cargo
            features: lite
            variant: GPL
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            binary: narou_rs
            target: aarch64-unknown-linux-gnu
            builder: cargo
            features: ""
            variant: ""
          - name: Linux ARM64 (GPL)
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            binary: narou_rs
            target: aarch64-unknown-linux-gnu
            builder: cargo
            features: lite
            variant: GPL
          - name: Raspberry Pi 2/3/4
            os: ubuntu-24.04
            platform: linux
            arch: armv7
            binary: narou_rs
            target: armv7-unknown-linux-gnueabihf
            builder: cross
            features: ""
            variant: ""
          - name: Raspberry Pi 2/3/4 (GPL)
            os: ubuntu-24.04
            platform: linux
            arch: armv7
            binary: narou_rs
            target: armv7-unknown-linux-gnueabihf
            builder: cross
            features: lite
            variant: GPL
          - name: Raspberry Pi Zero
            os: ubuntu-24.04
            platform: linux
            arch: armv6
            binary: narou_rs
            target: arm-unknown-linux-gnueabihf
            builder: cross
            features: ""
            variant: ""
          - name: Raspberry Pi Zero (GPL)
            os: ubuntu-24.04
            platform: linux
            arch: armv6
            binary: narou_rs
            target: arm-unknown-linux-gnueabihf
            builder: cross
            features: lite
            variant: GPL
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.variant }}

      - name: Add Rust target
        shell: pwsh
        run: rustup target add ${{ matrix.target }}

      - name: Install cross
        if: runner.os == 'Linux' && matrix.builder == 'cross'
        shell: bash
        run: cargo install cross --locked

      - name: Build backup binary
        if: matrix.platform != 'win'
        shell: pwsh
        env:
          NAROU_RS_RELEASE_BUILD: "1"
        run: |
          if ("${{ matrix.builder }}" -eq "cross") {
            $env:PKG_CONFIG_ALLOW_CROSS = "1"
            cross build --locked --release --target "${{ matrix.target }}" --bin narou_rs_backup
          } else {
            cargo build --locked --release --target "${{ matrix.target }}" --bin narou_rs_backup
          }

      - name: Build updater binary
        if: matrix.platform != 'win'
        shell: pwsh
        env:
          NAROU_RS_RELEASE_BUILD: "1"
        run: |
          if ("${{ matrix.builder }}" -eq "cross") {
            $env:PKG_CONFIG_ALLOW_CROSS = "1"
            cross build --locked --release --target "${{ matrix.target }}" --bin narou_rs_updater
          } else {
            cargo build --locked --release --target "${{ matrix.target }}" --bin narou_rs_updater
          }

      - name: Download signed updater
        if: matrix.platform == 'win'
        uses: actions/download-artifact@v4
        with:
          name: signed-updater-${{ matrix.target }}
          path: target/${{ matrix.target }}/release

      - name: Compute updater SHA-256
        id: updater_hash
        shell: pwsh
        run: |
          $binary = "${{ matrix.binary }}"
          if ($binary.EndsWith(".exe")) {
            $updaterBinary = "narou_rs_updater.exe"
          } else {
            $updaterBinary = "narou_rs_updater"
          }
          $updaterPath = "target/${{ matrix.target }}/release/$updaterBinary"
          if (-not (Test-Path -Path $updaterPath -PathType Leaf)) {
            throw "Updater binary not found: $updaterPath"
          }
          $hash = (Get-FileHash -Path $updaterPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "updater SHA-256: $hash"

      - name: Build release binary
        shell: pwsh
        env:
          NAROU_RS_RELEASE_BUILD: "1"
          NAROU_RS_UPDATER_SHA256: ${{ steps.updater_hash.outputs.hash }}
        run: |
          $featureArgs = @()
          if ("${{ matrix.features }}" -ne "") {
            $featureArgs += "--features"
            $featureArgs += "${{ matrix.features }}"
          }
          if ("${{ matrix.builder }}" -eq "cross") {
            $env:PKG_CONFIG_ALLOW_CROSS = "1"
            cross build --locked --release --target "${{ matrix.target }}" --bin narou_rs @featureArgs
          } else {
            cargo build --locked --release --target "${{ matrix.target }}" --bin narou_rs @featureArgs
          }

      - name: Upload unsigned Windows binary
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-main-${{ matrix.target }}${{ matrix.variant != '' && format('-{0}', matrix.variant) || '' }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

      - name: Package release asset
        if: matrix.platform != 'win'
        id: package
        shell: pwsh
        run: |
          $binary = "${{ matrix.binary }}"
          if ($binary.EndsWith(".exe")) {
            $updaterBinary = "narou_rs_updater.exe"
            $backupBinary = "narou_rs_backup.exe"
          } else {
            $updaterBinary = "narou_rs_updater"
            $backupBinary = "narou_rs_backup"
          }
          $commitVersion = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -ne "tag") {
            $commitVersion = "{0}+{1}" -f "${{ needs.validate.outputs.version }}", $env:GITHUB_SHA.Substring(0, 7)
          }
          $archivePath = & .\scripts\package-release.ps1 `
            -BinaryPath "target/${{ matrix.target }}/release/${{ matrix.binary }}" `
            -UpdaterBinaryPath "target/${{ matrix.target }}/release/$updaterBinary" `
            -BackupBinaryPath "target/${{ matrix.target }}/release/$backupBinary" `
            -Platform "${{ matrix.platform }}" `
            -Arch "${{ matrix.arch }}" `
            -PackageRoot "narou" `
            -CommitVersion $commitVersion `
            -Variant "${{ matrix.variant }}" `
            -OutputDir "dist"

          "archive_path=$archivePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "archive_name=$([System.IO.Path]::GetFileName($archivePath))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload release asset
        if: matrix.platform != 'win'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ steps.package.outputs.archive_path }}
          if-no-files-found: error

  sign-windows:
    name: Sign Windows binaries
    needs:
      - validate
      - build
    runs-on: windows-2025
    environment: CodeSining
    steps:
      - uses: actions/checkout@v4

      - name: Download unsigned binaries
        uses: actions/download-artifact@v4
        with:
          pattern: unsigned-main-*
          path: unsigned

      - name: Download signed updaters
        uses: actions/download-artifact@v4
        with:
          pattern: signed-updater-*
          path: signed-updater

      - name: Download signed backup binaries
        uses: actions/download-artifact@v4
        with:
          pattern: signed-backup-*
          path: signed-backup

      - name: Sign Windows binaries (Certum SimplySign)
        uses: Rumia-Channel/windows-certum-signin@main
        with:
          certum-username: ${{ secrets.CERTUM_USERNAME }}
          certum-otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certum-key-id: ${{ vars.CERTUM_KEY_ID }}
          signer: authenticode
          files: |
            unsigned\unsigned-main-x86_64-pc-windows-msvc\narou_rs.exe
            unsigned\unsigned-main-x86_64-pc-windows-msvc-GPL\narou_rs.exe
            unsigned\unsigned-main-aarch64-pc-windows-msvc\narou_rs.exe
            unsigned\unsigned-main-aarch64-pc-windows-msvc-GPL\narou_rs.exe

      - name: Package signed assets
        shell: pwsh
        run: |
          $targets = @(
            @{ Target = "x86_64-pc-windows-msvc"; Arch = "x64" },
            @{ Target = "aarch64-pc-windows-msvc"; Arch = "arm64" }
          )
          $variants = @("", "GPL")
          $commitVersion = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -ne "tag") {
            $commitVersion = "{0}+{1}" -f "${{ needs.validate.outputs.version }}", $env:GITHUB_SHA.Substring(0, 7)
          }
          foreach ($t in $targets) {
            $updater = "signed-updater\signed-updater-$($t.Target)\narou_rs_updater.exe"
            if (-not (Test-Path -Path $updater -PathType Leaf)) {
              throw "Signed updater not found: $updater"
            }
            $backup = "signed-backup\signed-backup-$($t.Target)\narou_rs_backup.exe"
            if (-not (Test-Path -Path $backup -PathType Leaf)) {
              throw "Signed backup binary not found: $backup"
            }
            foreach ($v in $variants) {
              $suffix = if ($v -eq "") { "" } else { "-$v" }
              $binary = "unsigned\unsigned-main-$($t.Target)$suffix\narou_rs.exe"
              if (-not (Test-Path -Path $binary -PathType Leaf)) {
                throw "Signed binary not found: $binary"
              }
              & .\scripts\package-release.ps1 `
                -BinaryPath $binary `
                -UpdaterBinaryPath $updater `
                -BackupBinaryPath $backup `
                -Platform "win" `
                -Arch $t.Arch `
                -PackageRoot "narou" `
                -CommitVersion $commitVersion `
                -Variant $v `
                -OutputDir "dist"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: dist
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - validate
      - build
      - sign-windows
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged release zips
        uses: actions/download-artifact@v4
        with:
          pattern: narou_rs_*.zip
          path: release-assets
          merge-multiple: true

      - name: Download signed Windows assets
        uses: actions/download-artifact@v4
        with:
          name: windows-assets
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: pwsh
        run: |
          $repo = $env:REPOSITORY
          $tag = $env:TAG_NAME
          $assets = Get-ChildItem -Path "release-assets" -File | Sort-Object Name
          if ($assets.Count -eq 0) {
            throw "No release assets were downloaded."
          }

          $releaseArgs = @("--title", $tag, "--verify-tag", "--generate-notes")
          if ($env:IS_PRERELEASE -eq "true") {
            $releaseArgs += "--prerelease"
          }

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo @releaseArgs
          } elseif ($env:IS_PRERELEASE -eq "true") {
            gh release edit $tag --repo $repo --prerelease
          }

          foreach ($asset in $assets) {
            gh release upload $tag $asset.FullName --repo $repo --clobber
          }
