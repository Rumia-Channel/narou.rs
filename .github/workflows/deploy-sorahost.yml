name: Deploy SORAHOST

# narou.rs 専用の SORAHOST (PteWorker) サーバーへ配備する。動くのは Repository
# variable `SORAHOST` が `T` のときだけで、その間は Cloudflare Workers 側の
# ジョブも止まる (`platform.yml` を参照)。
#
# 配備は `sorahost-cli` に任せる。SFTP も Cloudflare Tunnel も使わない
# (公開は PteWorker が行う。アプリは渡された PORT にループバックで束縛する)。
#
# Environment `SORAHOST` に置く値:
#   secrets SORAHOST_ENDPOINT    PteWorker のコンソールに出るエンドポイント
#   secrets SORAHOST_TOKEN       デプロイトークン (この 2 つが必須)
#   vars    SORAHOST_SMOKE_URL   任意。配備後の確認先 (未設定なら deploy が返す url)
#   ----- 前段に Cloudflare Tunnel + Access を置く場合だけ -----
#   secrets CLOUDFLARE_API_TOKEN     Account: Cloudflare Tunnel (Write/Edit),
#                                   Zone: DNS (Write/Edit) + Zone (Read),
#                                   Access を使うなら Access: Apps and Policies (Write/Edit)
#   vars    CLOUDFLARE_ACCOUNT_ID
#   vars    SORAHOST_TUNNEL_HOSTNAME 公開ホスト名 (例 narou.example.com)
#   vars    SORAHOST_SERVICE_PORT    コンテナ内の待受ポート (既定 18080)
#   vars    SORAHOST_ACCESS_EMAIL    Access で許可するメール (カンマ区切り)
#   vars    SORAHOST_ACCESS_DOMAIN   Access で許可するメールドメイン
# トンネルの接続トークンは CI では扱わない (ログに出さないため)。Cloudflare の
# ダッシュボードで確認し、PteWorker の .env に TUNNEL_TOKEN として置く。
#
# パネル側の環境変数 (NAROU_WEB_PASSWORD / S3_* など) はここではなく
# PteWorker の .env に置く。sorahost/README.md §9 を参照。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "アップロードせず送信内容だけ確認する"
        type: boolean
        default: false
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: deploy-sorahost
  cancel-in-progress: false

jobs:
  build:
    if: vars.SORAHOST == 'T'
    uses: ./.github/workflows/build-linux.yml

  deploy:
    needs: build
    if: vars.SORAHOST == 'T'
    runs-on: ubuntu-22.04
    environment: SORAHOST
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # 資格情報が無い環境 (fork / 未設定) では理由を出して省略する。
      # `--yes` で走らせるので、無いまま実行すると CLI 側がエラーで止まる。
      - name: Check the deployment values
        id: credentials
        env:
          SORAHOST_ENDPOINT: ${{ secrets.SORAHOST_ENDPOINT }}
          SORAHOST_TOKEN: ${{ secrets.SORAHOST_TOKEN }}
        run: |
          if [ -z "$SORAHOST_ENDPOINT" ] || [ -z "$SORAHOST_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SORAHOST_ENDPOINT / SORAHOST_TOKEN が未設定のため配備を省略します"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.credentials.outputs.configured == 'true'
        with:
          name: narou_rs-linux-x86_64
          path: dist

      # 配備するものだけを 1 つのフォルダーへ集める (`sorahost.json` の include と一致)。
      # ライブラリ (`library/`) はコンテナ側にあってここには含めない = 配備で触らない。
      - name: Assemble the deploy folder
        if: steps.credentials.outputs.configured == 'true'
        run: |
          set -eu
          bundle="dist/${{ needs.build.outputs.bundle }}"
          root="$(basename "${bundle%.tar.gz}")"
          mkdir -p deploy/app
          tar -xzf "$bundle" -C deploy/app --strip-components=1 \
            "$root/narou_rs" "$root/narou_rs_backup" "$root/webnovel"
          cp sorahost/start.sh deploy/start.sh
          cp sorahost/sorahost.json deploy/sorahost.json
          find deploy -maxdepth 2 | sort
          du -sh deploy

      # 前段の Cloudflare Tunnel と Access を用意する (未設定なら何もしない)。
      # アプリは 127.0.0.1:<SORAHOST_SERVICE_PORT> に居るので、そこへ向ける。
      - name: Set up the Cloudflare tunnel and Access
        if: steps.credentials.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          SORAHOST_TUNNEL_HOSTNAME: ${{ vars.SORAHOST_TUNNEL_HOSTNAME }}
          SORAHOST_SERVICE_PORT: ${{ vars.SORAHOST_SERVICE_PORT }}
          SORAHOST_TUNNEL_NAME: ${{ vars.SORAHOST_TUNNEL_NAME }}
          SORAHOST_ACCESS_EMAIL: ${{ vars.SORAHOST_ACCESS_EMAIL }}
          SORAHOST_ACCESS_DOMAIN: ${{ vars.SORAHOST_ACCESS_DOMAIN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${SORAHOST_TUNNEL_HOSTNAME:-}" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / SORAHOST_TUNNEL_HOSTNAME が未設定のため tunnel は触りません"
            exit 0
          fi
          python3 sorahost/ci/provision_tunnel.py

      - name: Deploy
        if: steps.credentials.outputs.configured == 'true'
        env:
          SORAHOST_ENDPOINT: ${{ secrets.SORAHOST_ENDPOINT }}
          SORAHOST_TOKEN: ${{ secrets.SORAHOST_TOKEN }}
        run: |
          set -o pipefail
          cd deploy
          npx --yes sorahost-cli deploy --yes --json \
            ${{ inputs.dry_run && '--dry-run' || '' }} | tee ../deploy-result.json

      # 配備結果の url (無ければ SORAHOST_SMOKE_URL) を叩く。basic 認証があるので
      # 401/403 でも「立っている」と見なす。
      - name: Smoke check
        if: >-
          steps.credentials.outputs.configured == 'true'
          && !inputs.dry_run
        env:
          SORAHOST_SMOKE_URL: ${{ vars.SORAHOST_SMOKE_URL }}
        run: |
          set -u
          url="$(python3 -c 'import json; print(json.load(open("deploy-result.json")).get("url") or "")')"
          url="${SORAHOST_SMOKE_URL:-$url}"
          if [ -z "$url" ]; then
            echo "::notice::確認先が分かりませんでした (SORAHOST_SMOKE_URL を設定すると確認できます)"
            exit 0
          fi
          echo "確認先: $url"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url" || true)
            echo "attempt ${attempt}: HTTP ${code:-none}"
            case "$code" in
              2*|401|403) echo "応答を確認しました"; exit 0 ;;
            esac
            sleep 10
          done
          echo "::warning::$url から期待した応答がありません"
          # 何が返っているか分かるように、最後にヘッダと本文の先頭を出す
          # (プラットフォームの 404 か、アプリが落ちているのかを切り分ける)。
          curl -sS -D - --max-time 30 "$url" 2>&1 | head -20 || true
