name: SORAHOST relay

# PteWorker のコンテナには curl / wget / python3 が入っていないため、静的 curl を
# CI でビルドして取得リレーと一緒にデプロイする。手動実行のみ（通常の push では動かさない）。
#
# 必要なシークレット:
#   SORAHOST_ENDPOINT  PteWorker のコンソールに出る接続先
#   SORAHOST_TOKEN     同じくコンソールのデプロイトークン（`token rotate` で再発行可）
#
# アプリ側の PROXY_TOKEN は Pterodactyl の .env に設定する（このワークフローでは扱わない）。

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 接続先とデプロイトークンは GitHub の SORAHOST environment に置く
    # (environment を宣言しないとそのシークレットは見えない)。
    environment: SORAHOST
    steps:
      - uses: actions/checkout@v4

      # 実測で動作を確認した配布物を使う（ソースビルドより速く、ハッシュで改ざん検出できる）。
      - name: Fetch the verified static curl
        run: |
          mkdir -p build
          base=https://github.com/moparisthebest/static-curl/releases/download/v8.21.0
          curl -fsSL -o build/curl "$base/curl-amd64"
          curl -fsSL -o sha256sum.txt "$base/sha256sum.txt"
          (cd build && grep 'curl-amd64' ../sha256sum.txt | sed 's|\./curl-amd64|curl|' | sha256sum -c -)
          chmod +x build/curl
          file build/curl

      - name: Assemble the deploy bundle
        run: |
          cp /etc/ssl/certs/ca-certificates.crt build/cacert.pem
          cp scripts/sorahost-proxy/server.mjs build/server.mjs
          chmod +x build/curl
          cat > build/sorahost.json <<'JSON'
          { "mode": "node", "framework": "node", "start": "node server.mjs", "include": ["server.mjs", "curl", "cacert.pem"] }
          JSON
          file build/curl
          ls -la build

      - name: Deploy to SORAHOST
        env:
          SORAHOST_ENDPOINT: ${{ secrets.SORAHOST_ENDPOINT }}
          SORAHOST_TOKEN: ${{ secrets.SORAHOST_TOKEN }}
        run: |
          cd build
          npx --yes sorahost-cli deploy --yes --json
