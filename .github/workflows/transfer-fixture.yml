name: Transfer fixture (Cloudflare 128 MiB)

on:
  push:
    branches: [develop, 'feature-*']
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKER_BUILD_VERSION: 0.8.5
  NAROU_WRANGLER_VERSION: 4.151.3
  WRANGLER_SEND_METRICS: "false"

jobs:
  fixture:
    name: Isolated deployed transfer regressions
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment:
      name: Cloudflare
    concurrency:
      group: narou-transfer-fixture-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      cleanup: ${{ steps.provision.outputs.cleanup }}
    defaults:
      run:
        working-directory: worker_entry
    env:
      # Match the existing Cloudflare environment, including its legacy spelling.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Set the isolated fixture state path
        run: echo "NAROU_TRANSFER_FIXTURE_STATE=$RUNNER_TEMP/transfer-fixture-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" >> "$GITHUB_ENV"
      - name: Require verification credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: cargo install worker-build --version "$WORKER_BUILD_VERSION" --locked
      - uses: actions/cache@v5
        with:
          path: ~/.cache/worker-build
          key: worker-build-${{ runner.os }}-${{ env.WORKER_BUILD_VERSION }}
      - name: Build the actual production shim and hashed transfer assets
        run: |
          node build_assets.mjs
          worker-build --release
      - name: Verify actual migration and namespace contracts
        run: python3 -m unittest discover -s tests -p 'test_transfer_v2_sql.py'
      - name: Provision only uniquely named disposable resources
        id: provision
        run: node ci/transfer_fixture.mjs provision
      - name: Exercise real enforced 128 MiB isolates
        run: node tests/transfer_memory_deployed.mjs
      - name: Remove this fixture only
        if: always() && steps.provision.outputs.cleanup != ''
        run: node ci/transfer_fixture.mjs cleanup

  # A separate runner repeats exact-name cleanup even if the fixture runner is
  # cancelled, crashes, or times out. The public receipt is emitted BEFORE the
  # first create request and contains no admin token, login key, or DB contents.
  cleanup:
    name: Guaranteed isolated resource cleanup
    needs: fixture
    if: always() && needs.fixture.outputs.cleanup != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Cloudflare
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NAROU_TRANSFER_FIXTURE_CLEANUP: ${{ needs.fixture.outputs.cleanup }}
    steps:
      - uses: actions/checkout@v5
      - name: Set the isolated cleanup state path
        run: echo "NAROU_TRANSFER_FIXTURE_STATE=$RUNNER_TEMP/transfer-fixture-cleanup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: node worker_entry/ci/transfer_fixture.mjs cleanup
