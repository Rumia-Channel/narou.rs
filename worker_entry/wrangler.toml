# ローカル開発用の設定。デプロイには使わない
# (`wrangler.<target>.toml` を CI がレンダリングした `wrangler.ci.toml` を使う)。
#
# ローカルの D1 は名前も ID も開発専用の値にしてある。実体は
# `.wrangler/state/v3/d1/` 配下の miniflare SQLite。

name = "narou-rs-local"
main = "build/worker/shim.mjs"
compatibility_date = "2026-08-10"
workers_dev = true

[limits]
# 有料プラン前提の余裕。EPUB 生成と長い queue ジョブを 1 invocation で扱う。
cpu_ms = 300000

[vars]
# 認証は既定で有効。ローカルで外すときだけ false にする。
NAROU_AUTH_REQUIRED = "true"
# S3 互換ストレージ。ローカルは MinIO 等を想定した既定値で、
# 実際に使うときは `--var` か `.dev.vars` で上書きする。
S3_ENDPOINT = "http://127.0.0.1:9000"
S3_REGION = "us-east-1"
S3_BUCKET = "narou-local"
S3_PREFIX = "narou/local"
# 資格情報は `wrangler dev --var S3_ACCESS_KEY_ID:... --var S3_SECRET_ACCESS_KEY:...`
# または gitignore 済みの `.dev.vars` で渡す (リポジトリに置かない)。

# Web UI (src/web/assets) を `build_assets.mjs` が `public/` へ焼き込む。
# 既定 (run_worker_first なし) では静的アセットが先に解決され、無いパスだけが
# Worker へ落ちる。`/api/*` と `/health/*` はアセットに無いので Worker が受ける。
[assets]
directory = "public"
binding = "ASSETS"
# `/settings` のような拡張子なし URL を `settings.html` に解決する。
html_handling = "auto-trailing-slash"
# 見つからないパスは Worker に流す (API の 404 を Worker が返す)。
not_found_handling = "none"

[build]
command = "node build_assets.mjs && worker-build --release"

[[d1_databases]]
binding = "DB"
database_name = "narou-local"
database_id = "local-narou"
migrations_dir = "migrations"

# --- jobs queue ---------------------------------------------------------
# Producer: POST /api/jobs と cron planner が version-2 envelopes
# (WorkerJobEnvelope {version, job_id, job}) を送る。

[[queues.producers]]
binding = "NAROU_JOBS"
queue = "narou-jobs-local"

# Consumer: D1 ledger で claim し、durable terminal を書いてから ack する。
# max_retries は ledger の attempt cap 以上にする (Cloudflare は explicit な
# `retry_with_options` も max_retries に数えるため、実効停止点は ledger 側の
# 3 回で、crash したメッセージは DLQ に落ちる)。
[[queues.consumers]]
queue = "narou-jobs-local"
max_batch_size = 1
max_retries = 3
dead_letter_queue = "narou-jobs-local-dlq"
max_concurrency = 4
# concurrency > 1 は安全: invocation ごとに runtime と Downloader を作り、
# D1 ledger の claim は atomic、SiteRateLimiter DO が per-site ペーシングを直列化する。

# DLQ の consumer は意図的に作らない。DLQ は運用者が中身を確認するための
# 退避先で、通常実行が drain / 再投入することはない。

# --- per-site rate limiting Durable Object ------------------------------
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "SiteRateLimiter"

# Web UI のコンソール/進捗イベントを WebSocket 接続へ配信する hub。
# メモリ上の履歴リングバッファのみ (ストレージは使わない)。
[[durable_objects.bindings]]
name = "PUSH_HUB"
class_name = "PushHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SiteRateLimiter"]

[[migrations]]
tag = "v2"
new_classes = ["PushHub"]

# 毎分実行。planner の D1 checkpoint が設定された HHMM スケジュールの到来を
# 判定し、1 回の実行を 1 ページに制限する。
[triggers]
crons = ["* * * * *"]
