[package]
name = "narou_worker"
version = "0.3.6"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []

[dependencies]
narou_rs = { package = "narou_rs", path = "..", default-features = false, features = ["worker-runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worker = { version = "0.8.5", features = ["queue"] }
