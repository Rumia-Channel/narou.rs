[package]
name = "narou_worker"
version = "0.4.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["case-insensitive"] }
futures = "0.3.33"
hex = "0.4.3"
hmac = "0.13.0"
js-sys = "0.3.104"
narou_rs = { package = "narou_rs", path = "..", default-features = false, features = ["worker-runtime"] }
send_wrapper = "0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
subtle = "2.6.1"
url = "2.5.8"
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.78"
worker = { version = "0.8.5", features = ["d1", "queue"] }
