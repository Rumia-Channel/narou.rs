# develop 環境テンプレート。
#
# `worker_entry/ci/render_config.py` が `__PLACEHOLDER__` を CI の環境変数で
# 置換し、`wrangler.ci.toml` を生成する (生成物は .gitignore 済み)。
# account 固有の値 (database_id / S3 の接続先 / secret 名) はここに書かない。
#
# ローカル開発は `wrangler.toml` (プレースホルダ無し) を使う。

name = "narou-rs-develop"
main = "build/worker/shim.mjs"
compatibility_date = "2026-08-10"
workers_dev = true

[limits]
# 有料プラン前提の余裕。EPUB 生成と長い queue ジョブを 1 invocation で扱う。
cpu_ms = 300000

[vars]
NAROU_AUTH_REQUIRED = "true"
S3_ENDPOINT = "__S3_ENDPOINT__"
S3_REGION = "__S3_REGION__"
S3_BUCKET = "__S3_BUCKET__"
S3_PREFIX = "__S3_PREFIX__"

# Web UI (src/web/assets) を `build_assets.mjs` が `public/` へ焼き込む。
# 既定 (run_worker_first なし) では静的アセットが先に解決され、無いパスだけが
# Worker へ落ちる。`/api/*` と `/health/*` はアセットに無いので Worker が受ける。
[assets]
directory = "public"
binding = "ASSETS"
# `/settings` のような拡張子なし URL を `settings.html` に解決する。
html_handling = "auto-trailing-slash"
# 見つからないパスは Worker に流す (API の 404 を Worker が返す)。
not_found_handling = "none"

# Secrets Store を使う場合、render_config.py がここに [[secrets_store_secrets]] を差し込む。
__SECRET_STORE_BLOCKS__

[build]
command = "node build_assets.mjs && worker-build --release"

# 資格情報は既定で Worker の secret (`wrangler secret` / `--secrets-file`) から読む。
# アカウント共有の Cloudflare Secrets Store に置く場合は、次の 2 つを有効にする
# （`store_id` はダッシュボードの Secrets Store の ID、`secret_name` はその中の名前。
#  binding 名は `<変数名>_STORE` にする決まりで、コード側がそれを見る）。
#
# [[secrets_store_secrets]]
# binding = "S3_ACCESS_KEY_ID_STORE"
# store_id = "<store-id>"
# secret_name = "narou-<env>-s3-access-key-id"
#
# [[secrets_store_secrets]]
# binding = "S3_SECRET_ACCESS_KEY_STORE"
# store_id = "<store-id>"
# secret_name = "narou-<env>-s3-secret-access-key"

[[d1_databases]]
binding = "DB"
database_name = "__NAROU_D1_DATABASE_NAME__"
database_id = "__NAROU_D1_DATABASE_ID__"
migrations_dir = "migrations"

# --- jobs queue ---------------------------------------------------------
# Producer: POST /api/jobs と cron planner が version-2 envelope を送る。
[[queues.producers]]
binding = "NAROU_JOBS"
queue = "__NAROU_JOB_QUEUE__"

# Consumer: D1 ledger で claim し、durable terminal を書いてから ack する。
# max_retries は ledger の attempt cap (3) 以上にする必要がある
# (explicit な retry_with_options も max_retries に数えられるため)。
[[queues.consumers]]
queue = "__NAROU_JOB_QUEUE__"
max_batch_size = 1
max_retries = 3
dead_letter_queue = "__NAROU_JOB_DLQ__"
max_concurrency = 4

# --- per-site rate limiting Durable Object -------------------------------
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "SiteRateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SiteRateLimiter"]

[triggers]
crons = ["* * * * *"]
