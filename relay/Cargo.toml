[package]
name = "narou_relay"
version = "0.5.2"
edition = "2024"
license = "BSD-2-Clause"
description = "narou.rs の外部取得リレー (Cloudflare 保護サイト向け)"
publish = false

[lib]
name = "narou_relay"
path = "src/lib.rs"

[[bin]]
name = "narou_relay"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
httparse = "1"
serde_json = "1"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
url = "2"
