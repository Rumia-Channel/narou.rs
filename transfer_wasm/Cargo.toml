[package]
name = "narou_transfer_wasm"
version = "0.6.0"
edition = "2024"
license = "BSD-2-Clause"
publish = false
description = "Browser WASM wrapper around narou.rs transfer archives"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
narou_rs = { path = "..", default-features = false, features = ["worker-runtime"] }
wasm-bindgen = "0.2"
futures = "0.3.34"
js-sys = "0.3.107"
wasm-bindgen-futures = "0.4.80"

