# cargo-about configuration for the non-GPL binaries.
#
# This is the copyleft gate: no crate is allowed a GPL license, directly or
# transitively. Run it against `about-probe/Cargo.toml`, which depends on
# `narou_rs` without the `lite` feature and therefore models exactly the
# dependency set of the non-GPL release archives:
#
#   cargo-about generate -m about-probe/Cargo.toml -c about-non-gpl.toml \
#       -o Third-Party-License-non-GPL.md about.hbs
#
# Scanning the workspace root with this file is expected to fail: the workspace
# always enables `lite` through `worker_entry`. That is the GPL side, and it is
# configured in `about.toml`.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "armv7-unknown-linux-gnueabihf",
    "arm-unknown-linux-gnueabihf",
]

workarounds = [
    "bitvec",
    "chrono",
    "cocoa",
    "gtk",
    "ring",
    "rustix",
    "rustls",
    "wasmtime",
]
