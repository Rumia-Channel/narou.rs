# ------------------------------------------------------------
# 小説サイト定義
# R18 作品は h.syosetu.org に分離されているが同一サイト(サイト名・
# domain とも syosetu.org として扱う)。URL パターンで実ドメインを
# キャプチャして toc_url / novel_info_url に反映し、h あり/なしの
# どちらの URL でも登録・取得できるようにする。誤ったドメインで
# アクセスした場合は正しいドメインへ 302 転送されるため、ダウンローダ
# のリダイレクト解決で toc_url が正しいドメインに更新される。
name: &name ハーメルン
domain: syosetu.org
top_url: https?://\\k<domain>
url:
  - https?://(?<domain>h\.syosetu\.org|syosetu\.org)/novel/(?<ncode>\d+)
  - https?://novel.syosetu.org/(?<ncode>\d+)
encoding: UTF-8
timezone: Asia/Tokyo
confirm_over18: no
append_title_to_folder_name: yes
title_strip_pattern: null
cookie: over18=off
over18_pattern: ※この作品はR-18です。
# R18 分離ドメイン (h.syosetu.org) は Cloudflare の managed challenge 配下に
# あり、ブラウザが必ず送る Sec-Fetch-* が無いリクエストは 403 で弾かれる
# (HTTP 403 + "Just a moment..." を返す)。実ブラウザ相当のヘッダを明示する。
headers:
  Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8
  Accept-Language: ja,en-US;q=0.9,en;q=0.8
  Sec-Fetch-Dest: document
  Sec-Fetch-Mode: navigate
  Sec-Fetch-Site: none
  Sec-Fetch-User: "?1"
  Upgrade-Insecure-Requests: "1"
sitename: *name
version: 1.8

# ------------------------------------------------------------
# 目次取得設定
# 作者ページ (作者追跡)。`narou author add https://syosetu.org/user/<uid>/`。
# 作品一覧は検索ページが返し、ページ分けされるので次ページを辿る (page=2, 3, …)。
author_url: ^https?://syosetu\.org/user/(?<uid>\d+)/?
author_api_url: https://syosetu.org/search/?mode=search_user_novel_list&uid=\k<uid>
author_novel_pattern: (?<novel_url>https?://(?:h\.)?syosetu\.org/novel/\d+/)
author_next_pattern: <a href="(?<author_next>https?://syosetu\.org/search/\?[^"]*page=\d+[^"]*)">>></a>
author_page_max: 50

toc_url: https://\\k<domain>/novel/\\k<ncode>/
subtitles: '(?:<li class="episode-list__chapter">\s*<div class="episode-list__chapter-title">(?<chapter>.+?)</div>\s*</li>\s*)?\s*<li class="episode-list__item.*?">\s*<a href="\./(?<index>\d+?)\.html" class="episode-list__link">\s*<span class="episode-list__mark.*?">.*?</span>\s*<span class="episode-list__title.*?"\s*>(?<subtitle>.+?)</span>\s*<time class="episode-list__date".*?>(?<subdate>.+?)</time>\s*<span class="episode-list__revision"(?: title="(?<subupdate>.+?)改稿")?>.*?</span>\s*</a>\s*</li>'

href: \\k<index>.html

error_message: 投稿者が削除、もしくは間違ったアドレスを指定しています|この作品は投稿者によって削除されました|この作品は完全非公開設定です|この小説は非公開設定になっています

# ------------------------------------------------------------
# 本文取得設定

body_pattern: |-
  <div id="honbun">(?<body>.+?)</div>\s*(?:<div id="atogaki">|<span id="analytics_end")

introduction_pattern: <div id="maegaki">(?<introduction>.+?)<br><hr><br></div>
postscript_pattern: <div id="atogaki"><br><hr><br>(?<postscript>.+?)</div>

illust_current_url: null
illust_grep_pattern: <a href="(?<src>[^"]+)" alt="挿絵" name='img'>【挿絵表示】</a>

# 目次ページから直接拾える基本情報
title: <span[^>]*itemprop="name">(?<title>.+?)</span>
author: 作者：<span itemprop="author">(?:<a [^>]+>)?(?<author>.+?)(?:</a>)?</span>

# ------------------------------------------------------------
# 小説情報からパースするための設定
novel_info_url: https://\\k<domain>/?mode=ss_detail&nid=\\k<ncode>

# タイトル
t: タイトル</td><td.*?><a href=.+?>(?<title>.+?)</a>

# novel_type 小説種別
nt: 話数</td><td.*?>(?<novel_type>.+?) .+?話</td>
novel_type_string:
  連載(連載中): 1
  連載(未完): 1
  連載(完結): 3
  短編: 2

# general_all_no 掲載話数
ga: 話数</td><td.*?>.+? (?<general_all_no>\d+)話</td>

# story あらすじ
s: "あらすじ</td><td.*?>(?<story>.+?)</td>"

# general_firstup 初回掲載日
gf: 掲載開始</td><td.*?>(?<general_firstup>.+?)</td>

# novelupdated_at 小説の更新時刻
nu: null

# general_lastup 最終掲載日
gl: 最新投稿</td><td.*?>(?<general_lastup>.+?)</td>

# writer 作者名
w: 作者</td><td.*?>(?:<a href=.+?>)?(?<writer>.+?)(?:</a>)?</td>

# length 文字数
l: 合計文字数</td><td.*?>(?<length>.+?)文字

# tags タグ
tags:
  - '<td class="label">(?:必須)?タグ</td><td.*?>(?<tags>.*?)</td>'
  - 'タグ：(?<tags>.+?)\s*(?i:<br\s*/?>|<hr\b)'
